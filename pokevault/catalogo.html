<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéVault | Catálogo de Productos</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <header>
        <nav class="navbar">
            <a href="index.html" class="nav-brand">PokéVault</a>
            <button class="theme-toggle" id="theme-toggle" aria-label="Cambiar tema">🌙</button>
            <button class="hamburger" id="hamburger-btn" aria-label="Abrir menú">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <ul class="nav-menu" id="nav-menu">
                <li><a href="index.html" class="nav-link">Inicio</a></li>
                <li><a href="catalogo.html" class="nav-link active">Catálogo</a></li>
                <li><a href="contacto.html" class="nav-link">Encargos & PSA</a></li>
                <li><a href="carrito.html" class="nav-link">Carrito (<span id="cart-count">0</span>)</a></li>
            </ul>
        </nav>
    </header>

    <main class="main-container">
        <section>
            <h1>Catálogo de Coleccionables</h1>
            <p>Filtra nuestra selección de consolas retro, cartuchos originales y cajas TCG.</p>

            <div class="filter-container" id="filter-container">
                <button class="filter-btn active" data-category="todos">Todos</button>
                <button class="filter-btn" data-category="tcg-boxes">Cajas TCG</button>
                <button class="filter-btn" data-category="psa-cards">Cartas PSA</button>
                <button class="filter-btn" data-category="consolas">Consolas DS / 3DS</button>
                <button class="filter-btn" data-category="juegos">Cartuchos Originales</button>
                <button class="filter-btn" data-category="peluches">Peluches & Merch</button>
            </div>

            <div class="catalog-grid" id="catalog-container"></div>
        </section>
    </main>

    <footer class="main-footer">
        <p>&copy; 2026 PokéVault Store — Desarrollo Web Individual</p>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
    <script src="js/catalogo.js"></script>

</html>
